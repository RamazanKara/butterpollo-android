  <script>
    // Pages serves this document at the missing URL, including nested paths.
    const segments = location.pathname.split('/').filter(Boolean);
    const project = segments.indexOf('rubylight-android');
    const directories = segments.length - (location.pathname.endsWith('/') ? 0 : 1);
    const depth = Math.max(0, directories - (project < 0 ? 0 : project + 1));
    const base = document.createElement('base');
    base.href = '../'.repeat(depth) || './';
    document.head.append(base);
  </script>
